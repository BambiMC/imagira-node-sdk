name: Release

# Tag-driven publish via PyPI Trusted Publishing — no long-lived API token
# lives in this repo. Configure the publisher once at
# https://pypi.org/manage/project/imagira-node-sdk/settings/publishing/
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

      - name: Check the tag matches the version in pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG pyproject=$PKG"
          test "$TAG" = "$PKG"

      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
